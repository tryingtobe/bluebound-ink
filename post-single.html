<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | Bluebound Ink</title>
    <!-- Importing Cormorant Garamond from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --bg-texture: radial-gradient(#1e293b 1px, transparent 1px);
            --bg-size: 32px 32px;
            
            --text-color: #ece3d0;
            --text-opacity: 0.6;
            --border-color: rgba(236, 227, 208, 0.15);
        }

        body.light-mode {
            --bg-color: #f7f4ec;
            --bg-texture: radial-gradient(#d1c7b7 1px, transparent 1px);
            --bg-size: 32px 32px;

            --text-color: #2c2925;
            --text-opacity: 0.6;
            --border-color: rgba(44, 41, 37, 0.15);
        }

        body {
            background-color: var(--bg-color);
            background-image: var(--bg-texture);
            background-size: var(--bg-size);
            
            font-family: "Cormorant Garamond", Georgia, serif;
            color: var(--text-color);
            max-width: 900px;
            margin: 100px auto;
            padding: 0 50px;
            line-height: 2.0;
            font-size: 1.4rem;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 90px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 45px;
        }

        .site-title {
            font-size: 2.9rem;
            font-weight: 500;
            letter-spacing: -0.5px;
            margin: 0;
            font-style: italic;
            color: var(--text-color);
            text-decoration: none;
            display: inline-block;
        }

        header nav {
            display: flex;
            align-items: center;
            gap: 40px;
            font-family: "Cormorant Garamond", Georgia, serif;
            font-size: 1.6rem;
        }

        header nav a {
            text-decoration: none;
            color: var(--text-color);
            opacity: 0.75;
            transition: opacity 0.2s ease, color 0.2s ease;
        }

        header nav a:hover {
            opacity: 1;
            color: #e6c567;
        }

        .theme-toggle {
            background: none;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            font-size: 1.6rem;
            opacity: 0.8;
            padding: 0;
            display: flex;
            align-items: center;
            transition: all 0.2s ease;
        }

        .theme-toggle:hover {
            opacity: 1;
            color: #e6c567;
        }

        /* "Ink" catches the gold accent */
        span.gold-ink {
            background: linear-gradient(135deg, #f3e5ab 0%, #d4af37 50%, #aa7c11 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Styling for the borderless Back button */
        .back-nav {
            margin-bottom: 40px;
        }

        .back-btn {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 0.85rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--text-color);
            opacity: 0.75;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: opacity 0.2s ease, color 0.2s ease;
            background: none;
            border: none;
            padding: 0;
        }

        .back-btn:hover {
            opacity: 1;
            color: #e6c567;
        }

        .empty-state {
            text-align: center;
            padding: 60px 0;
            font-style: italic;
            font-size: 2rem;
            color: var(--text-color);
            opacity: var(--text-opacity);
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>

    <header>
        <div class="site-branding">
            <h1 class="site-title"><a href="blog.html" style="color: inherit; text-decoration: none;">Bluebound <span class="gold-ink">Ink</span></a></h1>
        </div>
        <nav>
            <a href="books.html">Books</a>
            <a href="music.html">Music</a>
            <a href="about.html">About</a>
            <button class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()" aria-label="Toggle theme">🌙</button>
        </nav>
    </header>

    <main>
        <!-- Borderless Back Button to return to the Home page -->
        <div class="back-nav">
            <a href="blog.html" class="back-btn">&larr; Back to Home</a>
        </div>

        <div class="empty-state">
            Coming Soon...
        </div>
    </main>

    <script>
        const themeToggleBtn = document.getElementById('themeToggleBtn');

        function toggleTheme() {
            const body = document.body;
            body.classList.toggle('light-mode');
            
            if (body.classList.contains('light-mode')) {
                localStorage.setItem('theme', 'light');
                themeToggleBtn.textContent = '☀️';
            } else {
                localStorage.setItem('theme', 'dark');
                themeToggleBtn.textContent = '🌙';
            }
        }

        // Check saved theme on load
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-mode');
            themeToggleBtn.textContent = '☀️';
        } else {
            themeToggleBtn.textContent = '🌙';
        }
    </script>

</body>
</html>
