<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | Bluebound Ink</title>
    <!-- Importing Cormorant Garamond from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/style.css">
    
    <style>

        /* Styling for the borderless Back button */
        .back-nav {
            margin-bottom: 40px;
        }

        .back-btn {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 0.85rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--text-color);
            opacity: 0.75;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: opacity 0.2s ease, color 0.2s ease;
            background: none;
            border: none;
            padding: 0;
        }

        .back-btn:hover {
            opacity: 1;
            color: #e6c567;
        }

        .empty-state {
            text-align: center;
            padding: 60px 0;
            font-style: italic;
            font-size: 2rem;
            color: var(--text-color);
            opacity: var(--text-opacity);
            letter-spacing: 0.05em;
        }
    </style>
    <link rel="stylesheet" href="/design.css">
</head>
<body>

    <header id="site-header"></header>

    <main>
        <!-- Borderless Back Button to return to the Home page -->
        <div class="back-nav">
            <a href="blog.html" class="back-btn">&larr; Back to Home</a>
        </div>

        <div class="empty-state">
            Coming Soon...
        </div>
    </main>

    <footer id="site-footer" class="site-footer"></footer>
    <script src="/site.js"></script>
</body>
</html>
