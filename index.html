<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journal | Bluebound Ink</title>
    <!-- Importing Cormorant Garamond from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/style.css">
    
    <style>

        .posts-section-title {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 4px;
        }

        .post-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 60px;
        }

        .post-item {
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        .post-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .post-date {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 0.8rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--gold-date);
            white-space: nowrap;
            margin-left: 20px;
        }

        .post-title {
            font-size: 1.5rem;
            text-decoration: none;
            color: var(--text-color);
            font-weight: 400;
            line-height: 1.3;
            transition: color 0.2s ease;
        }

        .post-title:hover {
            color: #e6c567;
        }

        /* -------------------------------------------------------------
           OBVIOUS SIDE-PULL ENVELOPE / BOX POPUP
        ------------------------------------------------------------- */
        /* Highly visible Tab poking out from the right edge */
        .mail-trigger-tab {
            position: fixed;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            background-color: var(--envelope-bg);
            color: var(--gold-date);
            border: 2px solid var(--envelope-border);
            border-right: none;
            border-radius: 12px 0 0 12px;
            padding: 16px 14px;
            cursor: pointer;
            z-index: 999;
            box-shadow: -6px 4px 20px rgba(0, 0, 0, 0.35);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), background-color 0.3s ease;
        }

        .mail-trigger-tab:hover {
            transform: translateY(-50%) translateX(-8px);
            background-color: var(--envelope-border);
            color: var(--bg-color);
        }

        .mail-trigger-tab span {
            writing-mode: vertical-rl;
            text-transform: uppercase;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.15em;
        }

        /* Envelope Seal Wax Badge on Tab */
        .tab-stamp {
            width: 22 height: 22px;
            border-radius: 50%;
            background: var(--gold-date);
            color: var(--bg-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
        }

        /* Focus Backdrop */
        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(4px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 1000;
        }

        .drawer-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Enclosed Envelope Box Center-Pulling Animation */
        .mail-drawer {
            position: fixed;
            top: 50%;
            right: -450px; /* Offscreen right */
            transform: translateY(-50%) scale(0.9);
            width: 90%;
            max-width: 420px;
            background-color: var(--envelope-bg);
            color: var(--envelope-text);
            border: 2px solid var(--envelope-border);
            border-radius: 12px;
            box-shadow: var(--envelope-shadow);
            z-index: 1001;
            opacity: 0;
            transition: right 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease, background-color 0.3s ease;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* Dynamic Class: Pulls out into center of screen */
        .mail-drawer.open {
            right: calc(50% - 210px); /* Center position */
            transform: translateY(-50%) scale(1);
            opacity: 1;
        }

        /* Top Envelope Flap Triangular Design */
        .envelope-flap {
            width: 100%;
            height: 40px;
            background-color: var(--envelope-bg);
            border-bottom: 2px dashed var(--envelope-border);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .envelope-stamp {
            position: absolute;
            top: 10px;
            right: 15px;
            border: 1px dashed var(--envelope-border);
            padding: 3px 6px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--gold-date);
            transform: rotate(-5deg);
        }

        .drawer-content {
            padding: 25px 25px 30px 25px;
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .drawer-close-btn {
            background: none;
            border: none;
            font-size: 1.6rem;
            color: var(--envelope-text);
            opacity: 0.7;
            cursor: pointer;
            padding: 0;
            line-height: 1;
            transition: opacity 0.2s ease;
        }

        .drawer-close-btn:hover {
            opacity: 1;
            color: var(--gold-date);
        }

        .mail-drawer .posts-section-title {
            color: var(--gold-date);
            margin-bottom: 0;
        }

        /* Envelope Tags */
        .mail-drawer .tag-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 12px 0 16px 0;
        }

        .mail-drawer .tag-chip {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 0.7rem;
            letter-spacing: 0.05em;
            text-transform: lowercase;
            padding: 4px 10px;
            border-radius: 12px;
            background-color: var(--tag-bg);
            color: var(--envelope-text);
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mail-drawer .tag-chip:hover, 
        .mail-drawer .tag-chip.active {
            border-color: var(--gold-date);
            color: var(--gold-date);
        }

        .mail-drawer .tag-chip.active {
            background-color: var(--gold-date);
            color: var(--bg-color);
        }

        .mail-drawer .tag-chip.add-custom {
            border-style: dashed;
        }

        /* Form Controls */
        .mail-drawer .recommendation-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .mail-drawer .recommendation-form input, 
        .mail-drawer .recommendation-form textarea {
            padding: 8px 0;
            border: none;
            border-bottom: 1px solid var(--border-color);
            background-color: transparent;
            color: var(--envelope-text);
            font-size: 1rem;
            font-family: "Cormorant Garamond", Georgia, serif;
            transition: border-color 0.2s ease;
            width: 100%;
        }

        .mail-drawer .recommendation-form input:focus, 
        .mail-drawer .recommendation-form textarea:focus {
            outline: none;
            border-bottom-color: var(--gold-date);
        }

        .mail-drawer .recommendation-form input::placeholder, 
        .mail-drawer .recommendation-form textarea::placeholder {
            color: var(--envelope-placeholder);
        }

        .mail-drawer .custom-tag-input {
            display: none;
        }

        .mail-drawer .custom-tag-input.visible {
            display: block;
        }

        .mail-drawer .form-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }

        .mail-drawer .recommendation-form button[type="submit"] {
            background: var(--gold-date);
            border: none;
            color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            cursor: pointer;
            padding: 10px;
            border-radius: 4px;
            transition: opacity 0.2s ease;
            width: 100%;
        }

        .mail-drawer .recommendation-form button[type="submit"]:hover {
            opacity: 0.88;
        }
        /* Phones: move the Mail Note tab to the bottom so it does not cover text or buttons */
        @media screen and (max-width: 768px) {
            .mail-trigger-tab {
                top: auto;
                bottom: 24px;
                transform: none;
                padding: 12px 10px;
            }
        }
    </style>
</head>
<body>

    <header id="site-header"></header>

    <main>
        <h2 class="posts-section-title gold-accent">Latest Posts</h2>
        
        <div class="post-list">
            <article class="post-item">
                <div class="post-header">
                    <h2><a class="post-title" href="post-single.html">coming soon: post one</a></h2>
                    <div class="post-date">Soon</div>
                </div>
            </article>

            <article class="post-item">
                <div class="post-header">
                    <h2><a class="post-title" href="post-single.html">coming soon:second one</a></h2>
                    <div class="post-date">Soon</div>
                </div>
            </article>
        </div>
    </main>

    <!-- Side Trigger Tab -->
    <button class="mail-trigger-tab" id="openDrawerBtn" aria-label="Recommend a Book">
        <div class="tab-stamp">✦</div>
        <span>Mail Note</span>
    </button>

    <!-- Dimmed Focus Overlay -->
    <div class="drawer-overlay" id="drawerOverlay"></div>

    <!-- Center-Pull Envelope Box -->
    <aside class="mail-drawer" id="mailDrawer">
        <div class="envelope-flap">
            <div class="envelope-stamp">AIR MAIL</div>
        </div>
        <div class="drawer-content">
            <div class="drawer-header">
                <h2 class="posts-section-title">Leave a Book Suggestion</h2>
                <button class="drawer-close-btn" id="closeDrawerBtn" aria-label="Close panel">&times;</button>
            </div>

            <div class="tag-container" id="tagContainer">
                <button type="button" class="tag-chip active" data-tag="general">#general</button>
                <button type="button" class="tag-chip" data-tag="dark-academia">#dark-academia</button>
                <button type="button" class="tag-chip" data-tag="poetry">#poetry</button>
                <button type="button" class="tag-chip add-custom" id="addCustomTagBtn">+ custom</button>
            </div>

            <form id="recommendation-form" class="recommendation-form">
                <input type="text" id="custom-tag-input" class="custom-tag-input" placeholder="Custom tag name...">
                <input type="text" id="rec-book-info" placeholder="Title & Author *" required>
                <textarea id="rec-comment" rows="2" placeholder="Why read it? (optional)"></textarea>
                
                <div class="form-actions">
                    <button type="submit">Drop Note ✦</button>
                    <p id="rec-form-message" class="form-message" style="margin: 0; font-size: 0.8rem; text-align: center; width: 100%;"></p>
                </div>
            </form>
        </div>
    </aside>

    <footer id="site-footer" class="site-footer"></footer>

    <script src="/site.js"></script>

    <script>
        // Side Pull to Center Modal Interactions
        const mailDrawer = document.getElementById('mailDrawer');
        const drawerOverlay = document.getElementById('drawerOverlay');
        const openDrawerBtn = document.getElementById('openDrawerBtn');
        const closeDrawerBtn = document.getElementById('closeDrawerBtn');

        function openDrawer() {
            mailDrawer.classList.add('open');
            drawerOverlay.classList.add('active');
        }

        function closeDrawer() {
            mailDrawer.classList.remove('open');
            drawerOverlay.classList.remove('active');
        }

        openDrawerBtn.addEventListener('click', openDrawer);
        closeDrawerBtn.addEventListener('click', closeDrawer);
        drawerOverlay.addEventListener('click', closeDrawer);

        // Tag Handling
        let activeTag = 'general';
        const tagContainer = document.getElementById('tagContainer');
        const customTagInput = document.getElementById('custom-tag-input');
        const addCustomTagBtn = document.getElementById('addCustomTagBtn');

        tagContainer.addEventListener('click', (e) => {
            if (e.target.classList.contains('tag-chip') && !e.target.classList.contains('add-custom')) {
                document.querySelectorAll('.tag-chip').forEach(c => c.classList.remove('active'));
                e.target.classList.add('active');
                activeTag = e.target.getAttribute('data-tag');
                customTagInput.classList.remove('visible');
            }
        });

        addCustomTagBtn.addEventListener('click', () => {
            document.querySelectorAll('.tag-chip').forEach(c => c.classList.remove('active'));
            addCustomTagBtn.classList.add('active');
            customTagInput.classList.add('visible');
            customTagInput.focus();
            activeTag = 'custom';
        });

        function addNewTagChip(tagName) {
            const cleanTag = tagName.toLowerCase().replace(/[^a-z0-9-]/g, '');
            if (!cleanTag) return 'general';
            
            let existingChip = document.querySelector(`[data-tag="${cleanTag}"]`);
            if (!existingChip) {
                const newBtn = document.createElement('button');
                newBtn.type = 'button';
                newBtn.className = 'tag-chip active';
                newBtn.setAttribute('data-tag', cleanTag);
                newBtn.textContent = `#${cleanTag}`;
                tagContainer.insertBefore(newBtn, addCustomTagBtn);
            } else {
                existingChip.classList.add('active');
            }
            return cleanTag;
        }

        // Submit Handler
        document.getElementById('recommendation-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const messageEl = document.getElementById('rec-form-message');
            
            let finalTag = activeTag;
            if (activeTag === 'custom') {
                finalTag = addNewTagChip(customTagInput.value);
            }

            const payload = {
                bookInfo: document.getElementById('rec-book-info').value,
                comment: document.getElementById('rec-comment').value,
                tag: finalTag
            };

            try {
                const res = await fetch(window.API_BASE + '/api/recommendations', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    messageEl.textContent = "Sent!";
                    messageEl.style.color = "var(--gold-date)";
                    document.getElementById('recommendation-form').reset();
                    customTagInput.classList.remove('visible');
                    setTimeout(() => {
                        closeDrawer();
                        messageEl.textContent = "";
                    }, 1500);
                } else {
                    const data = await res.json();
                    messageEl.textContent = data.error || "Error submitting.";
                    messageEl.style.color = "#d32f2f";
                }
            } catch (err) {
                messageEl.textContent = "Error submitting.";
                messageEl.style.color = "#d32f2f";
            }
        });
    </script>
    
</body>
</html>
