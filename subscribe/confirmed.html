<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Subscribed | Bluebound Ink</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/style.css">

    <style>
        .status-message {
            margin-bottom: 60px;
        }

        .status-message h2 {
            font-size: 2.2rem;
            font-weight: 500;
            font-style: italic;
            margin: 0 0 20px 0;
        }

        .status-message p {
            opacity: 0.9;
        }

        .status-message a {
            color: var(--gold-date);
        }
    </style>
</head>
<body>

    <header id="site-header"></header>

    <main>
        <div class="status-message" id="status-message">
            <h2>You're subscribed</h2>
            <p>Thank you for confirming. A welcome email is on its way.</p>
            <p><a href="/books.html">Browse the reading log →</a></p>
        </div>
    </main>

    <footer id="site-footer" class="site-footer"></footer>

    <script src="/site.js"></script>
    <script>
        // The server adds ?status=invalid or ?status=error when something went wrong
        const status = new URLSearchParams(window.location.search).get('status');
        const box = document.getElementById('status-message');

        if (status === 'invalid') {
            box.innerHTML = '<h2>This link does not work</h2>' +
                '<p>It may be old, or you already unsubscribed. Please subscribe again at the bottom of this page.</p>';
        } else if (status === 'error') {
            box.innerHTML = '<h2>Something went wrong</h2>' +
                '<p>Please try the link in your email again in a few minutes.</p>';
        }
    </script>
</body>
</html>
